name: "TrekHAOS"
version: "5.0.0"
slug: "trek_haos"
description: "Self-hosted TREK trip planner"
url: "https://github.com/liketrek/TREK"
arch:
  - aarch64
  - amd64
init: false
legacy: true
image: "mauriceboe/trek"
environment:
  PORT: "3000"
  NODE_USE_ENV_PROXY: "1"
webui: "http://[HOST]:[PORT:3000]"
watchdog: "http://[HOST]:[PORT:3000]/api/health"
ports:
  3000/tcp: 3000
map:
  - type: data
    path: /app/data
  - type: data
    path: /app/uploads
options:
  COOKIE_SECURE: "false"
schema:
  ADMIN_EMAIL: email
  ADMIN_PASSWORD: "password(1,)"
  COOKIE_SECURE: "list(true|false)"
  NODE_ENV: "str?"
  ENCRYPTION_KEY: "password?"
  TZ: "str?"
  LOG_LEVEL: "str?"
  DEFAULT_LANGUAGE: "list(en|de|es|fr|hu|nl|br|cs|pl|ru|zh|zh-TW|it|tr|ar|id|ja|ko|uk|gr|sv|vi|ca)?"
  SESSION_DURATION: "str?"
  SESSION_DURATION_REMEMBER: "str?"
  ALLOWED_ORIGINS: "str?"
  ALLOW_INTERNAL_NETWORK: "list(true|false)?"
  ALLOW_LINK_LOCAL_IPS: "str?"
  APP_URL: "url?"
  TREK_WIKI_DIR: "str?"
  HTTP_PROXY: "url?"
  HTTPS_PROXY: "url?"
  NO_PROXY: "str?"
  FORCE_HTTPS: "list(true|false)?"
  HSTS_INCLUDE_SUBDOMAINS: "list(true|false)?"
  TRUST_PROXY: "int?"
  OIDC_ISSUER: "url?"
  OIDC_CLIENT_ID: "str?"
  OIDC_CLIENT_SECRET: "password?"
  OIDC_DISPLAY_NAME: "str?"
  OIDC_ONLY: "list(true|false)?"
  OIDC_ADMIN_CLAIM: "str?"
  OIDC_ADMIN_VALUE: "str?"
  OIDC_SCOPE: "str?"
  OIDC_DISCOVERY_URL: "url?"
  WEBAUTHN_RP_ID: "str?"
  WEBAUTHN_ORIGINS: "str?"
  SMTP_HOST: "str?"
  SMTP_PORT: "int?"
  SMTP_USER: "str?"
  SMTP_PASS: "password?"
  SMTP_FROM: "str?"
  SMTP_SKIP_TLS_VERIFY: "list(true|false)?"
  MCP_RATE_LIMIT: "int?"
  MCP_MAX_SESSION_PER_USER: "int?"
  MCP_SESSION_TTL: "int?"
  MCP_SSE_KEEPALIVE: "int?"
  TREK_API_DOCS_ENABLED: "list(true|false)?"
  KITINERARY_EXTRACTOR_PATH: "str?"
  TRANSIT_API_URL: "url?"
  UNSPLASH_ACCESS_KEY: "password?"
  TREK_PLACES_ENABLED: "list(true|false)?"
  TREK_PLACES_URL: "url?"
  AMAP_API_KEY: "password?"
  AMAP_API_SECRET: "password?"
  AMAP_API_BASE: "url?"
  TREK_PLACE_PHOTO_DIR: "str?"
  BACKUP_UPLOAD_LIMIT_MB: "int?"
  BACKUP_MAX_DECOMPRESSED_MB: "int?"
  TREK_DB_JOURNAL_MODE: "list(DELETE|TRUNCATE|PERSIST|MEMORY|WAL|OFF)?"
  TREK_DB_SYNCHRONOUS: "list(OFF|NORMAL|FULL|EXTRA)?"
  IDEMPOTENCY_TTL_SECONDS: "int?"
  NOMINATIM_URL: "url?"
  OVERPASS_URL: "str?"
  OVERPASS_TIMEOUT_MS: "int?"
  LLM_TIMEOUT_MS: "int?"
  DEMO_MODE: "list(true|false)?"
  DEMO_ADMIN_USER: "str?"
  DEMO_ADMIN_EMAIL: "email?"
  DEMO_ADMIN_PASS: "password?"
  TREK_PLUGINS_ENABLED: "list(true|false)?"
  TREK_PLUGINS_DIR: "str?"
  TREK_PLUGINS_DATA_DIR: "str?"
  TREK_PLUGIN_REGISTRY_URL: "url?"
  TREK_PLUGIN_MAX_RSS_MB: "int?"
  TREK_PLUGIN_PERMISSIONS: "str?"
  TREK_PLUGIN_ALLOW_PRIVATE_EGRESS: "list(true|false)?"
  TREK_PLUGINS_DEV_LINK: "list(true|false)?"
  TREK_PLUGINS_IGNORE_TREK_RANGE: "list(true|false)?"
  TREK_PLUGIN_AI_PER_DAY: "int?"
  TREK_PLUGIN_NOTIFY_PER_DAY: "int?"
  TREK_PLUGIN_RPC_PER_SEC: "int?"
  TREK_PLUGIN_RPC_BURST: "int?"
  TREK_PLUGIN_RPC_INFLIGHT: "int?"
  TREK_PLUGIN_LOG_PER_SEC: "int?"
  TREK_PLUGIN_LOG_BURST: "int?"
  TREK_PLUGIN_AUDIT_MAX_ROWS: "int?"
